[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-ems-controller"
version = "0.1.0"
description = "Edge EMS controller: control loop, PI, droop, HTTP API"
requires-python = ">=3.10"
dependencies = [
  "edge-ems-common",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "influxdb-client>=1.45",
  "paho-mqtt>=2",
]

[tool.setuptools.packages.find]
where = ["src"]
