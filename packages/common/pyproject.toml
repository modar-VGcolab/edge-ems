[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-ems-common"
version = "0.1.0"
description = "Shared data-model machinery for the edge EMS (loader, validation, conformity)"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "pydantic>=2.8"]

[tool.setuptools.packages.find]
where = ["src"]
