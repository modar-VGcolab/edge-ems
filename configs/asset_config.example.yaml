# Example site configuration. New site = copy, edit, validate (POST /config/assets/validate).
# All names, units, and signs come from data_model.yaml — see limits/nominal schemas there.

data_model_version: "0.1"

site:
  id: vgcolab-01
  name: "VGCOLAB-01"
  location: [00.000000, 00.000000]

assets:
  - id: pcc-01
    class: pcc
    name: PCC monitor
    nominal: { voltage_v: 230, frequency_hz: 50 }
    limits: { max_current_a: 100, max_supply_power_kva: 1000, max_feed_power_kva: 300 }
    comm:
      protocol: modbus_tcp
      host: 192.168.1.20
      port: 502
      unit_id: 1
      register_map: maps/grid_meter_v1.yaml

  - id: bess-01
    class: battery
    name: Battery
    flexibility:
      control: power_setpoint
      limits:
        max_charge_kw: 500
        max_discharge_kw: 500
        min_soc_pct: 10
        max_soc_pct: 90
        min_warning_soc_pct: 20
        max_warning_soc_pct: 85
    nominal: { capacity_kwh: 215 }
    comm:
      protocol: modbus_tcp
      host: 192.168.1.22
      port: 502
      unit_id: 1
      register_map: maps/custom_bess_v1.yaml

  - id: pv-01
    class: pv
    name: PV plant
    flexibility:
      control: derate
      limits: { min_derate_factor: 0.0 }
    nominal: { max_active_power_kw: 500 }
    limits: { max_power_kva: 501 }
    comm:
      protocol: modbus_tcp
      host: 192.168.1.23
      port: 502
      unit_id: 1
      register_map: maps/custom_pv_inverter_v1.yaml

  - id: fload-01
    class: flexible_load
    name: Flexible load
    flexibility:
      control: derate
      limits: { min_derate_factor: 0.3 }
    nominal: { max_active_power_kw: 500 }
    comm:
      protocol: modbus_tcp
      host: 192.168.1.24
      port: 502
      unit_id: 1
      register_map: maps/flexible_load_v1.yaml

  - id: meter-01
    class: meter
    name: Fixed load meter
    limits: { max_power_kw: 100 }
    comm:
      protocol: modbus_tcp
      host: 192.168.1.25
      port: 502
      unit_id: 1
      register_map: maps/meter_v1.yaml
