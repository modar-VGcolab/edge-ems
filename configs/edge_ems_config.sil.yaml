# SIL (software-in-the-loop) runtime configuration.
# influxdb.token uses the "${INFLUX_TOKEN}" placeholder; core.main._load and
# controller.config_manager._read_raw expand ${VAR} via os.path.expandvars, so
# the token resolves from the INFLUX_TOKEN env var (supplied to both containers
# through env_file: configs/.env in the compose 'sil' profile). That same value
# must match DOCKER_INFLUXDB_INIT_ADMIN_TOKEN in deploy/docker-compose.yml, which
# also reads ${INFLUX_TOKEN}. Keep configs/.env's INFLUX_TOKEN in sync with the
# token the InfluxDB volume was initialized with, or writes get 401.
# Loaded by core/controller via EMS_CONFIG_PATH in the compose 'sil' profile.

data_model_version: "0.1"

influxdb:
  url: "http://influxdb:8086"
  org: "edge"
  bucket: "edge_ems"
  token: "${INFLUX_TOKEN}"

mqtt:
  broker_address: "mosquitto"
  broker_port: 1883
  client_id: "edge-ems-controller"
  username: ""
  password: ""

controller:
  update_period: 1.0        # s
  Kp: 0.5
  Ki: 0.5
  timeout_period: 2.0       # s, staleness threshold (>= update_period)
  hold_max_s: 10.0          # s in HOLD before transitioning to SAFE
  slew_limit_kw_s: 200.0    # battery setpoint slew limit

droop:
  enabled: false
  p_f_droop:
    enabled: false
    # arrays: [min, deadband_min, deadband_max, max]; p.u. for dP/dQ, Hz for f
    dP_f: [-0.1, -0.05, 0.05, 0.1]
    dQ_f: [0.0, 0.0, 0.0, 0.0]
    f: [49.5, 49.8, 50.2, 50.5]
  q_v_droop:
    enabled: false
    dP_V: [0.0, 0.0, 0.0, 0.0]
    dQ_V: [-0.1, -0.05, 0.05, 0.1]
    V: [207, 219, 241, 253]

asset_aggregation:
  battery:
    measurements: [soc_pct, active_power_kw, reactive_power_kvar,
                   available_charge_power_kw, available_discharge_power_kw]
    setpoint_type: battery
  pv:
    measurements: [active_power_kw, reactive_power_kvar]
    setpoint_type: pv
  flexible_load:
    measurements: [active_power_kw, reactive_power_kvar]
    setpoint_type: load
  pcc:
    measurements: [voltage_v, frequency_hz, current_a, active_power_kw, reactive_power_kvar]
    setpoint_type: pcc

http_api:
  host: "0.0.0.0"
  port: 5000
  debug: false

logging:
  level: "INFO"
