# Rig (CHIL) runtime config for CONTAINERS. InfluxDB/MQTT are reached by their
# compose service names (same docker network). token expands from ${INFLUX_TOKEN}
# (supplied to core/controller via env_file: configs/.env). Identical endpoints
# to the SIL config; named separately to pair with asset_config.docker.yaml.

data_model_version: "0.1"

influxdb:
  url: "http://influxdb:8086"
  org: "edge"
  bucket: "edge_ems"
  token: "${INFLUX_TOKEN}"

mqtt:
  broker_address: "mosquitto"
  broker_port: 1883
  client_id: "edge-ems-controller"
  username: ""
  password: ""

controller:
  update_period: 1.0        # s
  Kp: 0.5
  Ki: 0.5
  timeout_period: 2.0       # s, staleness threshold (>= update_period)
  hold_max_s: 10.0          # s in HOLD before transitioning to SAFE
  slew_limit_kw_s: 200.0    # battery setpoint slew limit
  pcc_setpoint_kw: 0.0      # self-consumption target (A4 used -100.0; reverted)

droop:
  enabled: false
  p_f_droop:
    enabled: false
    dP_f: [-0.1, -0.05, 0.05, 0.1]
    dQ_f: [0.0, 0.0, 0.0, 0.0]
    f: [49.5, 49.8, 50.2, 50.5]
  q_v_droop:
    enabled: false
    dP_V: [0.0, 0.0, 0.0, 0.0]
    dQ_V: [-0.1, -0.05, 0.05, 0.1]
    V: [207, 219, 241, 253]

asset_aggregation:
  battery:
    measurements: [soc_pct, active_power_kw, reactive_power_kvar,
                   available_charge_power_kw, available_discharge_power_kw]
    setpoint_type: battery
  pv:
    measurements: [active_power_kw, reactive_power_kvar]
    setpoint_type: pv
  flexible_load:
    measurements: [active_power_kw, reactive_power_kvar]
    setpoint_type: load
  pcc:
    measurements: [voltage_v, frequency_hz, current_a, active_power_kw, reactive_power_kvar]
    setpoint_type: pcc

http_api:
  host: "0.0.0.0"
  port: 5000
  debug: false

logging:
  level: "INFO"
