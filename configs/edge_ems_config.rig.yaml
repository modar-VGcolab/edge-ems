# Rig (CHIL) runtime configuration -- core + controller run as host processes in
# .venv-rig, talking to InfluxDB/MQTT published on localhost by docker compose.
# influxdb.token uses ${INFLUX_TOKEN}; both loaders expand env vars, so export
# INFLUX_TOKEN (must equal DOCKER_INFLUXDB_INIT_ADMIN_TOKEN, default "change-me").

data_model_version: "0.1"

influxdb:
  url: "http://localhost:8086"
  org: "edge"
  bucket: "edge_ems"
  token: "${INFLUX_TOKEN}"

mqtt:
  broker_address: "localhost"
  broker_port: 1883
  client_id: "edge-ems-controller"
  username: ""
  password: ""

controller:
  update_period: 1.0        # s
  Kp: 0.3                   # detuned for the rig comms latency (was 0.5)
  Ki: 0.2                   # was 0.5; Kp/Ki=0.5/0.5 is underdamped once the
                            # bridge+Modbus+InfluxDB+MQTT dead time is included.
                            # 0.3/0.2 removes the first-swing overshoot (zero
                            # overshoot, ~12-15 s settle) at 1-2 cycles of delay;
                            # see hil/tuning/tune_pi_latency.py. Confirm on the rig.
  # Performance options (default 0 => behaviour identical to the pure PI above;
  # enable + confirm on the rig). Kd adds damping so Kp/Ki can be raised without
  # overshoot despite the comms dead time; deriv_filter_tau (~2-3x update_period)
  # keeps the derivative from amplifying measurement noise. pv_feedforward_gain
  # (0..1) cancels PV's direct PCC effect so the loop doesn't chase generation
  # ramps through the integrator -- start ~0.8 once the PV sign/scale is verified.
  Kd: 0.0                   # derivative gain (on measurement)
  deriv_filter_tau: 0.0     # s; low-pass on the derivative (0 = unfiltered)
  pv_feedforward_gain: 0.0  # [0,1] fraction of PV offset fed forward
  timeout_period: 2.0       # s, staleness threshold (>= update_period)
  hold_max_s: 10.0          # s in HOLD before transitioning to SAFE
  slew_limit_kw_s: 200.0    # battery setpoint slew limit

droop:
  enabled: false
  p_f_droop:
    enabled: false
    dP_f: [-0.1, -0.05, 0.05, 0.1]
    dQ_f: [0.0, 0.0, 0.0, 0.0]
    f: [49.5, 49.8, 50.2, 50.5]
  q_v_droop:
    enabled: false
    dP_V: [0.0, 0.0, 0.0, 0.0]
    dQ_V: [-0.1, -0.05, 0.05, 0.1]
    V: [207, 219, 241, 253]

# Tariff-driven power-factor control at the PCC. When enabled, the active window
# (local wall-clock) sets a PF goal that the controller turns into a battery
# reactive setpoint; Q-V droop (above) keeps priority whenever it is commanding.
# q_sign_convention (+1/-1) calibrates the battery VarSet direction against the
# live PCC meter -- VERIFY on the rig, may need flipping (like the other sign
# flags). s_rated_kva clamps reactive to the inverter capability circle. Disabled
# by default; the windows below are an illustrative peak/off-peak schedule.
pfc:
  enabled: false
  q_sign_convention: 1        # +1 or -1; confirm against PCC reactive sign on rig
  s_rated_kva: 500            # battery inverter apparent rating for the Q clamp
  default:
    pf_target: 1.0            # unity outside every window (no reactive command)
    mode: unity
  windows:
    - {start: "08:00", end: "20:00", pf_target: 0.95, mode: lagging}   # peak: absorb VARs (inductive)
    - {start: "20:00", end: "08:00", pf_target: 0.98, mode: leading}   # off-peak: supply VARs (capacitive)

asset_aggregation:
  battery:
    measurements: [soc_pct, active_power_kw, reactive_power_kvar,
                   available_charge_power_kw, available_discharge_power_kw]
    setpoint_type: battery
  pv:
    measurements: [active_power_kw, reactive_power_kvar]
    setpoint_type: pv
  flexible_load:
    measurements: [active_power_kw, reactive_power_kvar]
    setpoint_type: load
  pcc:
    measurements: [voltage_v, frequency_hz, current_a, active_power_kw, reactive_power_kvar]
    setpoint_type: pcc

http_api:
  host: "0.0.0.0"
  port: 5000
  debug: false

logging:
  level: "INFO"
